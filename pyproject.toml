[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cop-thief-game"
version = "0.1.0"
description = "Cop & Thief dual-agent pursuit game engine"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastmcp>=2.0",
    "crewai>=0.80",
    "httpx>=0.28.1",
    "anthropic>=0.111.0",
    "google-auth>=2.55.0",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.198.0",
]

[project.scripts]
game = "game.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game", "src/actor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "D"]
ignore = ["D203", "D213", "ANN101", "ANN102"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/game"]
omit = ["src/game/wrappers/*", "src/game/sdk/*"]

[tool.coverage.report]
fail_under = 85

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
